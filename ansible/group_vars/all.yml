---
# =============================================================================
# Global Variables for Spring Petclinic Ansible Configuration
# Location: ansible/group_vars/all.yml
# Purpose: Default variables applied to all hosts unless overridden
# Environment: Override in group_vars/{dev,staging,prod}.yml
# =============================================================================

# -----------------------------------------------------------------------------
# Project Identity & Environment
# -----------------------------------------------------------------------------
project_name: "spring-petclinic"
app_env: "{{ lookup('env', 'ENVIRONMENT') | default('dev', true) }}"
aws_region: "{{ lookup('env', 'AWS_REGION') | default('us-east-1', true) }}"
aws_account_id: "{{ lookup('env', 'AWS_ACCOUNT_ID') | default('', true) }}"

# Version tracking for audit purposes
infrastructure_version: "2.0.0"
last_updated: "{{ ansible_date_time.iso8601 | default('unknown') }}"

# -----------------------------------------------------------------------------
# Ansible Connection Settings
# -----------------------------------------------------------------------------
ansible_user: ec2-user
ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/spring-petclinic-microservices/terraform/live/{{ app_env }}/key-pair/spms-{{ app_env }}.pem"
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectionAttempts=5 -o ConnectTimeout=30'
ansible_ssh_retries: 3
ansible_ssh_timeout: 30

# Privilege escalation
ansible_become: true
ansible_become_method: sudo
ansible_become_user: root

# -----------------------------------------------------------------------------
# System Configuration
# -----------------------------------------------------------------------------
timezone: "UTC"
ntp_servers:
  - "0.amazon.pool.ntp.org"
  - "1.amazon.pool.ntp.org"
  - "2.amazon.pool.ntp.org"
  - "3.amazon.pool.ntp.org"

# System packages to install on all hosts
common_packages:
  - vim
  - wget
  - curl
  - git
  - htop
  - iotop
  - net-tools
  - tcpdump
  - jq
  - unzip
  - tree
  - sysstat
  - nmap-ncat

# -----------------------------------------------------------------------------
# SSH Hardening Configuration
# Aligned with: ansible/templates/sshd_config.j2
# Compliance: CIS Amazon Linux 2 Benchmark v1.2.0
# -----------------------------------------------------------------------------
ssh_hardening:
  # Basic Settings
  port: 22
  address_family: "any"
  listen_address: "0.0.0.0"
  
  # Authentication (CIS 5.2.x)
  permit_root_login: "no"
  password_authentication: "no"
  pubkey_authentication: "yes"
  challenge_response_authentication: "no"
  permit_empty_passwords: "no"
  permit_user_environment: "no"
  use_pam: "yes"
  
  # Session Limits
  max_auth_tries: 3
  max_sessions: 10
  login_grace_time: 60
  client_alive_interval: 300
  client_alive_count_max: 2
  
  # Forwarding (Disabled for security)
  x11_forwarding: "no"
  allow_tcp_forwarding: "no"
  allow_agent_forwarding: "no"
  permit_tunnel: "no"
  gateway_ports: "no"
  
  # Logging
  log_level: "INFO"
  syslog_facility: "AUTH"
  
  # Banner & MOTD
  banner_path: "/etc/ssh/banner"
  print_motd: "no"
  print_last_log: "yes"
  
  # Environment & Compression
  accept_env: "LANG LC_*"
  compression: "delayed"
  tcp_keep_alive: "yes"
  use_dns: "no"
  
  # Subsystem
  subsystem: "sftp /usr/libexec/openssh/sftp-server"
  
  # Cryptographic Settings (CIS 5.2.17 - 5.2.20)
  kex_algorithms:
    - curve25519-sha256
    - curve25519-sha256@libssh.org
    - diffie-hellman-group-exchange-sha256
    - diffie-hellman-group16-sha512
    - diffie-hellman-group18-sha512
  
  ciphers:
    - chacha20-poly1305@openssh.com
    - aes256-gcm@openssh.com
    - aes128-gcm@openssh.com
    - aes256-ctr
    - aes192-ctr
    - aes128-ctr
  
  macs:
    - hmac-sha2-512-etm@openssh.com
    - hmac-sha2-256-etm@openssh.com
    - hmac-sha2-512
    - hmac-sha2-256
  
  host_key_algorithms:
    - ssh-ed25519
    - ssh-ed25519-cert-v01@openssh.com
    - rsa-sha2-512
    - rsa-sha2-512-cert-v01@openssh.com
    - rsa-sha2-256
    - rsa-sha2-256-cert-v01@openssh.com
  
  # Access Control (populate per environment)
  allow_users: []
  allow_groups:
    - ec2-user
    - sudo
  deny_users: []
  deny_groups: []
  
  # Environment-specific overrides
  prod_settings:
    max_auth_tries: 2
    login_grace_time: 30
    client_alive_interval: 180
    client_alive_count_max: 1

# -----------------------------------------------------------------------------
# Fail2ban Configuration
# Aligned with: ansible/templates/fail2ban_jail_local.j2
# -----------------------------------------------------------------------------
fail2ban:
  enabled: true
  bantime: 3600  # 1 hour
  findtime: 600  # 10 minutes
  maxretry: 5
  ignore_ip:
    - "127.0.0.1/8"
    - "::1/128"
  
  # Jails to enable
  jails:
    - sshd
    - sshd-ddos
    - recidive
  
  # Email notifications (optional)
  dest_email: "{{ monitoring_alert_email | default('') }}"
  sender: "fail2ban@{{ project_name }}.local"
  mta: "sendmail"
  
  # Action
  action: "%(action_mwl)s"  # Ban + email with whois logs

# -----------------------------------------------------------------------------
# Firewall Configuration (firewalld)
# -----------------------------------------------------------------------------
firewall:
  enabled: true
  default_zone: "public"
  masquerade: false
  icmp_block_inversion: true
  log_denied: "all"
  
  # Base allowed services
  allowed_services:
    - ssh
  
  # Ports opened per host group (override in group_vars)
  allowed_ports: []
  
  # Rich rules for advanced filtering
  rich_rules: []

# -----------------------------------------------------------------------------
# Audit Configuration (auditd)
# Compliance: CIS, SOC2, PCI-DSS
# -----------------------------------------------------------------------------
audit:
  enabled: true
  log_file: /var/log/audit/audit.log
  max_log_file: 100  # MB
  max_log_file_action: keep_logs
  num_logs: 5
  space_left_action: email
  admin_space_left_action: halt
  action_mail_acct: root
  
  # Audit rules (CIS 4.1.x)
  rules:
    # Identity monitoring
    - "-w /etc/passwd -p wa -k identity"
    - "-w /etc/group -p wa -k identity"
    - "-w /etc/shadow -p wa -k identity"
    - "-w /etc/gshadow -p wa -k identity"
    
    # Sudo monitoring
    - "-w /etc/sudoers -p wa -k sudoers"
    - "-w /etc/sudoers.d/ -p wa -k sudoers"
    
    # Authentication logs
    - "-w /var/log/secure -p wa -k auth_log"
    - "-w /var/log/audit/ -p wa -k audit_log"
    - "-w /var/log/faillog -p wa -k logins"
    - "-w /var/log/lastlog -p wa -k logins"
    
    # SSH configuration
    - "-w /etc/ssh/sshd_config -p wa -k sshd_config"
    
    # PAM configuration
    - "-w /etc/pam.d/ -p wa -k pam_config"
    - "-w /etc/security/ -p wa -k security_config"
    
    # Network configuration
    - "-w /etc/hosts -p wa -k etc_hosts"
    - "-w /etc/network/ -p wa -k network_config"
    - "-w /etc/sysconfig/network-scripts/ -p wa -k network_config"
    
    # Cron configuration
    - "-w /etc/cron.allow -p wa -k cron"
    - "-w /etc/cron.deny -p wa -k cron"
    - "-w /etc/cron.d/ -p wa -k cron"
    - "-w /etc/cron.daily/ -p wa -k cron"
    - "-w /etc/cron.hourly/ -p wa -k cron"
    - "-w /etc/cron.monthly/ -p wa -k cron"
    - "-w /etc/cron.weekly/ -p wa -k cron"
    - "-w /etc/crontab -p wa -k cron"
    
    # Executable monitoring
    - "-a exit,always -F arch=b64 -S execve -k user_commands"
    - "-a exit,always -F arch=b32 -S execve -k user_commands"
    
    # Privilege escalation
    - "-a exit,always -F arch=b64 -F euid=0 -S execve -k root_commands"
    - "-a exit,always -F arch=b32 -F euid=0 -S execve -k root_commands"
    
    # File deletion monitoring
    - "-a exit,always -F arch=b64 -S unlink -S unlinkat -S rename -S renameat -k delete"
    - "-a exit,always -F arch=b32 -S unlink -S unlinkat -S rename -S renameat -k delete"

# -----------------------------------------------------------------------------
# User Security & Password Policies
# -----------------------------------------------------------------------------
user_security:
  # Password aging
  password_max_days: 90
  password_min_days: 7
  password_warn_age: 14
  password_inactive_days: 30
  
  # Password quality
  password_min_length: 14
  password_retry: 3
  password_enforce_for_root: true
  
  # Account lockout
  lockout_time: 600  # 10 minutes
  fail_interval: 900  # 15 minutes
  deny_count: 5
  
  # Umask
  default_umask: "0027"
  
  # Session timeout
  session_timeout: 900  # 15 minutes

# -----------------------------------------------------------------------------
# Kernel Hardening (sysctl)
# CIS 3.2.x - Network Security
# -----------------------------------------------------------------------------
kernel_hardening:
  # IP Spoofing protection
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  
  # Ignore ICMP redirects
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  
  # Disable IPv4 packet forwarding (unless router)
  net.ipv4.ip_forward: 0
  net.ipv6.conf.all.forwarding: 0
  
  # Ignore ICMP broadcasts
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  
  # Ignore bogus ICMP errors
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  
  # Log suspicious packets
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  
  # TCP SYN Cookie protection
  net.ipv4.tcp_syncookies: 1
  
  # Disable source routing
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  
  # Disable send redirects
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  
  # TCP stack hardening
  net.ipv4.tcp_max_syn_backlog: 2048
  net.ipv4.tcp_synack_retries: 2
  net.ipv4.tcp_syn_retries: 5
  net.ipv4.tcp_fin_timeout: 15
  net.ipv4.tcp_keepalive_time: 1800
  net.ipv4.tcp_keepalive_probes: 5
  net.ipv4.tcp_keepalive_intvl: 15
  
  # Kernel security
  kernel.yama.ptrace_scope: 1
  kernel.dmesg_restrict: 1
  kernel.kptr_restrict: 2
  kernel.unprivileged_bpf_disabled: 1
  kernel.unprivileged_userns_clone: 0
  
  # Core dumps
  fs.suid_dumpable: 0
  
  # Randomize VA space
  kernel.randomize_va_space: 2

# -----------------------------------------------------------------------------
# SELinux Configuration
# -----------------------------------------------------------------------------
selinux:
  state: enforcing
  policy: targeted

# -----------------------------------------------------------------------------
# Docker Configuration
# Aligned with: ansible/roles/docker/templates/daemon.json.j2
# -----------------------------------------------------------------------------
docker:
  version: "latest"
  storage_driver: "overlay2"
  log_driver: "json-file"
  log_opts:
    max-size: "10m"
    max-file: "3"
  
  # Daemon options (matches daemon.json.j2)
  daemon_options:
    storage_driver: "overlay2"
    log_driver: "json-file"
    log_opts:
      max-size: "10m"
      max-file: "3"
    live-restore: true
    userland-proxy: false
    iptables: true
  
  # Groups
  groups:
    - name: docker
      gid: 999
  
  # Users to add to docker group
  users:
    - ec2-user
    - jenkins
  
  # Registry mirrors (optional)
  registry_mirrors: []
  
  # Insecure registries (avoid in production)
  insecure_registries: []
  
  # DNS settings
  dns:
    - "169.254.169.253"  # Route 53 resolver
    - "8.8.8.8"
    - "8.8.4.4"
  
  # Storage settings
  storage_settings:
    data_root: "/var/lib/docker"
    exec_root: "/var/run/docker"
    run_root: "/var/run/docker"
  
  # Resource limits
  default_ulimits:
    - "nofile=65536:65536"
    - "nproc=65536:65536"

# -----------------------------------------------------------------------------
# Java Configuration
# Aligned with: ansible/roles/java/
# -----------------------------------------------------------------------------
java:
  version: "21"
  distribution: "amazon"  # Amazon Corretto
  home: "/usr/lib/jvm/java-21-amazon-corretto"
  
  # Environment variables
  env_vars:
    JAVA_HOME: "/usr/lib/jvm/java-21-amazon-corretto"
    PATH: "$JAVA_HOME/bin:$PATH"
  
  # Alternative versions (for multi-version support)
  alternatives:
    java: "/usr/lib/jvm/java-21-amazon-corretto/bin/java"
    javac: "/usr/lib/jvm/java-21-amazon-corretto/bin/javac"
    jar: "/usr/lib/jvm/java-21-amazon-corretto/bin/jar"

# -----------------------------------------------------------------------------
# Maven Configuration
# Aligned with: ansible/roles/maven/
# -----------------------------------------------------------------------------
maven:
  version: "3.9.6"
  home: "/opt/maven"
  
  # Settings
  settings:
    local_repository: "{{ ansible_user_dir }}/.m2/repository"
    interactive_mode: false
    offline: false
    
    # Mirrors
    mirrors:
      - id: central-mirror
        mirror_of: central
        url: "https://repo.maven.apache.org/maven2"
    
    # Profiles
    profiles:
      - id: spring-petclinic
        properties:
          java.version: "21"
          maven.compiler.source: "21"
          maven.compiler.target: "21"
    
    active_profiles:
      - spring-petclinic

# -----------------------------------------------------------------------------
# Jenkins Configuration
# Aligned with: ansible/playbooks/deployment/jenkins-setup.yml
# -----------------------------------------------------------------------------
jenkins:
  version: "2.426.1"
  http_port: 8080
  https_port: 8443
  agent_port: 50000
  home: "/var/lib/jenkins"
  user: jenkins
  group: jenkins
  
  # Docker image (for containerized deployment)
  docker_image: "jenkins/jenkins:lts-jdk21"
  
  # JVM options
  java_opts: "-Xmx2g -Xms1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.awt.headless=true"
  
  # Security
  security:
    enable_csrf: true
    cli_enabled: false
    disable_cli_over_remoting: true
  
  # Plugins (pinned versions)
  plugins:
    - kubernetes:4188.v87a_d188d153c
    - docker:1.5
    - git:5.2.1
    - pipeline:1289.v394210274929
    - workflow-aggregator:596.v8c21c963d92d
    - aws-credentials:218.v1b_923706cb_63
    - aws-java-sdk:1.12.595-423.vc12228717d70
    - credentials-binding:657.v2b_19db_7d6e6d
    - configuration-as-code:1810.v9b_c30a_249a_4c
    - job-dsl:1.87
    - blueocean:1.27.9
    - pipeline-utility-steps:2.16.1
    - pipeline-maven:1382.v5138d841e862
    - sonar:2.17.2
    - trivy:1.8.0
    - slack:684.v833089650554
    - email-ext:1806.v3df8ca_82c814d
    - mailer:438.v02c7f0a_12fa_4
    - build-timeout:1.32
    - throttle-concurrents:2.10
    - rebuild:330.v645b_7df10e2a
    - generic-webhook-trigger:2.0.1
  
  # Backup
  backup:
    enabled: true
    schedule: "0 2 * * *"  # Daily at 2 AM
    retention_days: 30
    destination: "s3://{{ aws.s3.backup_bucket }}/jenkins"

# -----------------------------------------------------------------------------
# SonarQube Configuration
# -----------------------------------------------------------------------------
sonarqube:
  version: "10.4.0"
  http_port: 9000
  docker_image: "sonarqube:10.4-community"
  home: "/opt/sonarqube"
  data_dir: "/opt/sonarqube/data"
  extensions_dir: "/opt/sonarqube/extensions"
  logs_dir: "/opt/sonarqube/logs"
  
  # Default credentials (MUST CHANGE IN PRODUCTION!)
  admin_user: admin
  admin_password: "{{ lookup('env', 'SONAR_ADMIN_PASSWORD') | default('admin', true) }}"
  
  # Plugins
  plugins:
    - sonar-java-plugin
    - sonar-javascript-plugin
    - sonar-python-plugin
    - sonar-checkstyle
    - sonar-findbugs

# -----------------------------------------------------------------------------
# Kubernetes Configuration
# Aligned with: ansible/roles/kubernetes_setup/
# -----------------------------------------------------------------------------
kubernetes:
  version: "1.28"
  cni: "amazon-vpc"  # EKS uses VPC CNI
  
  # EKS cluster settings
  cluster_name: "{{ project_name }}-eks-{{ app_env }}"
  namespace: "petclinic"
  
  # Kubelet configuration
  kubelet:
    max_pods: 110
    pod_infra_container_image: "public.ecr.aws/eks-distro/kubernetes/pause:3.9"
    cluster_dns: "169.254.20.10"
    cluster_domain: "cluster.local"
  
  # Addons
  addons:
    - metrics-server
    - coredns
    - kube-proxy
    - aws-load-balancer-controller
    - external-dns
  
  # Resource quotas
  resource_quotas:
    enabled: true
    cpu_limit: "4"
    memory_limit: "8Gi"
    pod_limit: "20"

# -----------------------------------------------------------------------------
# Helm Configuration
# Aligned with: ansible/roles/helm/
# -----------------------------------------------------------------------------
helm:
  version: "3.13.0"
  
  # Repositories
  repositories:
    - name: bitnami
      url: "https://charts.bitnami.com/bitnami"
    - name: prometheus-community
      url: "https://prometheus-community.github.io/helm-charts"
    - name: grafana
      url: "https://grafana.github.io/helm-charts"
    - name: ingress-nginx
      url: "https://kubernetes.github.io/ingress-nginx"
    - name: aws
      url: "https://aws.github.io/eks-charts"
    - name: jetstack
      url: "https://charts.jetstack.io"

# -----------------------------------------------------------------------------
# AWS Configuration
# -----------------------------------------------------------------------------
aws:
  cli_version: "2"
  region: "{{ aws_region }}"
  
  # ECR
  ecr:
    repository_prefix: "spring-petclinic"
  
  # S3
  s3:
    backup_bucket: "spring-petclinic-backups-{{ app_env }}"
    state_bucket: "petclinic-state-{{ app_env }}"
  
  # CloudWatch
  cloudwatch:
    enabled: true
    log_group_prefix: "/spring-petclinic/{{ app_env }}"
    retention_days: 90

# -----------------------------------------------------------------------------
# Monitoring Configuration
# Aligned with: ansible/playbooks/deployment/monitoring-stack.yml
# -----------------------------------------------------------------------------
monitoring:
  # Prometheus
  prometheus:
    enabled: true
    version: "2.45.0"
    port: 9090
    scrape_interval: "30s"
    evaluation_interval: "30s"
    retention: "30d"
    data_dir: "/var/lib/prometheus"
  
  # Grafana
  grafana:
    enabled: true
    version: "10.0.0"
    port: 3000
    admin_user: admin
    admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') | default('admin', true) }}"
    data_dir: "/var/lib/grafana"
  
  # Node Exporter
  node_exporter:
    enabled: true
    version: "1.6.0"
    port: 9100
  
  # Alertmanager
  alertmanager:
    enabled: true
    version: "0.26.0"
    port: 9093
  
  # Alerting
  alerting:
    enabled: true
    email: "{{ monitoring_alert_email | default('platform-team@spring-petclinic.com') }}"
    slack_webhook: "{{ monitoring_slack_webhook | default('') }}"
  
  # Dashboards
  dashboards:
    - name: "Spring Petclinic Overview"
      file: "../../docker/grafana/dashboards/grafana-petclinic-dashboard.json"
    - name: "Node Exporter Full"
      url: "https://grafana.com/api/dashboards/1860/revisions/23/download"
    - name: "Prometheus Stats"
      url: "https://grafana.com/api/dashboards/2/revisions/2/download"

# -----------------------------------------------------------------------------
# Logging Configuration
# Aligned with: ansible/roles/cloudwatch_agent/
# -----------------------------------------------------------------------------
logging:
  centralized: true
  driver: "awslogs"
  region: "{{ aws_region }}"
  group: "/spring-petclinic/{{ app_env }}"
  retention_days: 90
  
  # Log paths to forward
  log_paths:
    - /var/log/secure
    - /var/log/audit/audit.log
    - /var/log/fail2ban.log
    - /var/log/jenkins/jenkins.log
    - /var/log/docker.log
    - /var/log/syslog
    - /var/log/messages

# -----------------------------------------------------------------------------
# Backup Configuration
# -----------------------------------------------------------------------------
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 30
  destination: "s3://{{ aws.s3.backup_bucket }}/{{ app_env }}"
  
  # What to backup
  include:
    - /var/lib/jenkins
    - /var/lib/grafana
    - /var/lib/prometheus
    - /opt/sonarqube/data
    - /etc/kubernetes
    - /var/log
  
  # What to exclude
  exclude:
    - "*.log"
    - "*.tmp"
    - "cache/*"
    - "tmp/*"

# -----------------------------------------------------------------------------
# Security Compliance Standards
# -----------------------------------------------------------------------------
compliance_standards:
  - "CIS Amazon Linux 2 Benchmark v1.2.0"
  - "SOC2 Type II"
  - "PCI-DSS v4.0"
  - "HIPAA Security Rule"

# -----------------------------------------------------------------------------
# Feature Flags
# -----------------------------------------------------------------------------
feature_flags:
  genai_enabled: false
  chat_enabled: false
  analytics_enabled: true
  maintenance_mode: false

# -----------------------------------------------------------------------------
# CloudWatch Agent Configuration
# Aligned with: ansible/roles/cloudwatch_agent/templates/amazon-cloudwatch-agent.json.j2
# -----------------------------------------------------------------------------
cloudwatch_agent:
  enabled: true
  config_path: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
  
  # Metrics to collect
  metrics:
    namespace: "SpringPetclinic"
    append_dimensions:
      - InstanceId
      - ImageId
      - InstanceType
    
    metrics_collected:
      cpu:
        measurement:
          - usage_active
          - usage_idle
          - usage_user
          - usage_system
        totalcpu: true
      memory:
        measurement:
          - used_percent
          - available_percent
      disk:
        measurement:
          - used_percent
          - free_percent
        resources:
          - "/"
      net:
        measurement:
          - bytes_sent
          - bytes_recv
          - packets_sent
          - packets_recv
  
  # Logs to forward
  logs:
    log_group_name: "/spring-petclinic/{{ app_env }}"
    log_stream_name: "{{ inventory_hostname }}"
    retention_days: 90

# -----------------------------------------------------------------------------
# Vault Integration
# Aligned with: ansible/roles/vault_integration/
# -----------------------------------------------------------------------------
vault:
  enabled: true
  addr: "{{ lookup('env', 'VAULT_ADDR') | default('http://127.0.0.1:8200', true) }}"
  token_path: "/etc/vault/token"
  secret_paths:
    database: "secret/data/spring-petclinic/database"
    api_keys: "secret/data/spring-petclinic/api-keys"
    certificates: "secret/data/spring-petclinic/certificates"

# -----------------------------------------------------------------------------
# Trivy Scanner Configuration
# Aligned with: ansible/roles/trivy_scan/
# -----------------------------------------------------------------------------
trivy:
  enabled: true
  version: "0.48.0"
  cache_dir: "/var/cache/trivy"
  severity:
    - CRITICAL
    - HIGH
  ignore_unfixed: true
  timeout: "10m"

# -----------------------------------------------------------------------------
# GitOps Configuration
# Aligned with: ansible/roles/gitops_operator/
# -----------------------------------------------------------------------------
gitops:
  enabled: true
  operator: "argocd"  # or "flux"
  
  argocd:
    version: "2.9.0"
    namespace: "argocd"
    admin_password: "{{ lookup('env', 'ARGOCD_ADMIN_PASSWORD') | default('admin', true) }}"
  
  flux:
    version: "2.1.0"
    namespace: "flux-system"

# -----------------------------------------------------------------------------
# Environment-Specific Overrides Helper
# Use this pattern to conditionally apply settings based on environment
# -----------------------------------------------------------------------------
env_overrides:
  dev:
    log_level: "DEBUG"
    replica_count: 1
    resource_requests:
      cpu: "100m"
      memory: "256Mi"
    resource_limits:
      cpu: "500m"
      memory: "512Mi"
  
  staging:
    log_level: "INFO"
    replica_count: 2
    resource_requests:
      cpu: "250m"
      memory: "512Mi"
    resource_limits:
      cpu: "1000m"
      memory: "1Gi"
  
  prod:
    log_level: "WARN"
    replica_count: 3
    resource_requests:
      cpu: "500m"
      memory: "1Gi"
    resource_limits:
      cpu: "2000m"
      memory: "2Gi"
    security:
      pod_security_standards: "restricted"
      network_policies_enabled: true

# -----------------------------------------------------------------------------
# Applied Settings (computed from env_overrides)
# -----------------------------------------------------------------------------
log_level: "{{ env_overrides[app_env].log_level | default('INFO') }}"
replica_count: "{{ env_overrides[app_env].replica_count | default(2) }}"
resource_requests: "{{ env_overrides[app_env].resource_requests | default({'cpu': '250m', 'memory': '512Mi'}) }}"
resource_limits: "{{ env_overrides[app_env].resource_limits | default({'cpu': '1000m', 'memory': '1Gi'}) }}"