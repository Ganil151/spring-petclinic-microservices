---
# =============================================================================
# Kubernetes Setup Role - Defaults
# Purpose: Default variables for EKS cluster configuration & K8s resource deployment
# Alignment: Must match Terragrunt EKS module outputs
# =============================================================================

# --- AWS & Cluster Context (Critical for Terragrunt Integration) ---
aws_region: "us-east-1"
eks_cluster_name: "petclinic-eks"          # ← MUST match Terragrunt output
eks_cluster_endpoint: ""                   # ← Typically passed via extra_vars from Terragrunt
eks_cluster_ca_certificate: ""             # ← Typically passed via extra_vars from Terragrunt

# --- Kubernetes Version Control ---
kubernetes_version: "1.28"                 # ← Pin minor version; avoid 'latest' in prod
control_plane_upgrade: false               # ← Safety flag for major version jumps

# --- Namespace & Networking ---
default_namespace: "petclinic"
service_type: "ClusterIP"                  # ← Internal only; use ALB Ingress for external
vpc_cni_configure_rps: true                # ← Tune Network Performance

# --- IAM Roles for Service Accounts (IRSA) ---
oidc_provider_enabled: true                # ← Required for AWS SDK access from pods
oidc_provider_arn: ""                      # ← Terragrunt output

# --- Helm Charts (Spring Petclinic Dependencies) ---
helm_charts:
  - name: aws-load-balancer-controller
    namespace: kube-system
    version: "1.6.0"
    repo: https://aws.github.io/eks-charts
  - name: external-dns
    namespace: kube-system
    version: "1.12.0"
    repo: https://kubernetes-sigs.github.io/external-dns/
  - name: spring-petclinic
    namespace: "{{ default_namespace }}"
    version: "1.0.0"
    repo: https://your-private-chart-museum.com

# --- Resource Quotas (Governance) ---
resource_quotas_enabled: true
cpu_limit: "4"
memory_limit: "8Gi"

# --- Security Context ---
pod_security_standards: "baseline"         # ← Enforce PSS
network_policies_enabled: true