---
# Kubernetes Setup Defaults

# Kubernetes version
kubernetes_version: "1.29"

# Container runtime
container_runtime: containerd

# Network plugin
kubernetes_cni_plugin: calico
kubernetes_cni_version: "3.26"

# Cluster configuration
kubernetes_cluster_name: petclinic-cluster
kubernetes_pod_network_cidr: "10.244.0.0/16"
kubernetes_service_cidr: "10.96.0.0/12"

# API server configuration
kubernetes_api_port: 6443

# Kubeconfig path
kubernetes_kubeconfig_dir: /etc/kubernetes
kubernetes_kubeconfig_file: admin.conf
