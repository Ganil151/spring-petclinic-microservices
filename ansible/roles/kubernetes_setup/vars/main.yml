---
# Kubernetes Setup Variables (role-specific, not meant to be overridden)

# Package names
kubernetes_packages:
  - kubelet
  - kubeadm
  - kubectl

# Required kernel modules
kubernetes_kernel_modules:
  - br_netfilter
  - overlay
  - ip_vs
  - ip_vs_rr
  - ip_vs_wrr
  - ip_vs_sh
  - nf_conntrack

# Required sysctl parameters
kubernetes_sysctl_params:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
