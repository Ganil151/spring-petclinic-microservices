---
# Jenkins Variables (role-specific, not meant to be overridden)

# Jenkins package name
jenkins_package_name: jenkins

# Jenkins repository configuration
jenkins_repo_url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
jenkins_repo_gpg_key: https://pkg.jenkins.io/redhat-stable/jenkins.io.key

# Jenkins service name
jenkins_service_name: jenkins

# Jenkins config file
jenkins_config_file: /etc/sysconfig/jenkins

# Jenkins lock file
jenkins_lock_file: /var/run/jenkins/jenkins.pid
