---
# =============================================================================
# Helm Role for Spring Petclinic Microservices
# =============================================================================

- name: Install Helm 3
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  
  vars:
    helm_version: "3.13.0"
    helm_install_dir: "/usr/local/bin"
  
  tasks:
    - name: Display Helm installation start
      ansible.builtin.debug:
        msg: "Starting Helm {{ helm_version }} installation on {{ inventory_hostname }}"
      tags: always

    - name: Check if Helm is already installed
      ansible.builtin.command: helm version --short
      register: helm_check
      changed_when: false
      failed_when: false
      tags: helm

    - name: Download Helm installer
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
        dest: "/tmp/helm-v{{ helm_version }}-linux-amd64.tar.gz"
        mode: '0644'
      when: helm_check.rc != 0
      tags: helm

    - name: Extract Helm
      ansible.builtin.unarchive:
        src: "/tmp/helm-v{{ helm_version }}-linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true
      when: helm_check.rc != 0
      tags: helm

    - name: Install Helm binary
      ansible.builtin.copy:
        src: "/tmp/linux-amd64/helm"
        dest: "{{ helm_install_dir }}/helm"
        mode: '0755'
        remote_src: true
      when: helm_check.rc != 0
      tags: helm

    - name: Clean up installer files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/helm-v{{ helm_version }}-linux-amd64.tar.gz"
        - /tmp/linux-amd64
      tags: helm

    - name: Verify Helm installation
      ansible.builtin.command: helm version --short
      register: helm_version_check
      changed_when: false
      tags: helm

    - name: Display Helm version
      ansible.builtin.debug:
        var: helm_version_check.stdout
      tags: helm

    - name: Add Helm repositories
      ansible.builtin.command:
        cmd: "helm repo add {{ item.name }} {{ item.url }}"
      loop: "{{ helm_repositories | default([]) }}"
      tags: helm
      changed_when: false
      failed_when: false

    - name: Update Helm repositories
      ansible.builtin.command:
        cmd: helm repo update
      tags: helm
      changed_when: false
