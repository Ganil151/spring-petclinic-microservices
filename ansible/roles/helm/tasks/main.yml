---
# =============================================================================
# Helm Role — tasks/main.yml
# Installs Helm 3 on Amazon Linux 2
# =============================================================================

- name: Check if Helm is already installed
  ansible.builtin.command: helm version --short
  register: helm_check
  changed_when: false
  failed_when: false
  tags: helm

- name: Download Helm {{ helm_version | default('3.13.0') }} archive
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-v{{ helm_version | default('3.13.0') }}-linux-amd64.tar.gz"
    dest: "/tmp/helm-v{{ helm_version | default('3.13.0') }}-linux-amd64.tar.gz"
    mode: '0644'
    timeout: 60
  when: helm_check.rc != 0
  tags: helm

- name: Extract Helm archive
  ansible.builtin.unarchive:
    src: "/tmp/helm-v{{ helm_version | default('3.13.0') }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
  when: helm_check.rc != 0
  tags: helm

- name: Install Helm binary to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: '0755'
    remote_src: true
  when: helm_check.rc != 0
  tags: helm

- name: Clean up Helm installer files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/helm-v{{ helm_version | default('3.13.0') }}-linux-amd64.tar.gz"
    - /tmp/linux-amd64
  tags: helm

- name: Add Helm repositories
  ansible.builtin.command:
    cmd: "helm repo add {{ item.name }} {{ item.url }}"
  loop: "{{ helm_repositories | default([]) }}"
  changed_when: false
  failed_when: false
  tags: helm

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false
  when: helm_repositories | default([]) | length > 0
  tags: helm

- name: Verify Helm installation
  ansible.builtin.command: helm version --short
  register: helm_version_check
  changed_when: false
  tags: helm

- name: Show Helm version
  ansible.builtin.debug:
    msg: "Helm installed: {{ helm_version_check.stdout }}"
  tags: helm
