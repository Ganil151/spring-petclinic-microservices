---
# =============================================================================
# Terraform Role - tasks/main.yml
# =============================================================================

- name: Check if Terraform is already installed
  ansible.builtin.command: terraform version
  register: terraform_check
  changed_when: false
  failed_when: false
  tags: terraform

- name: Add HashiCorp repository
  ansible.builtin.command:
    cmd: yum-config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
    creates: /etc/yum.repos.d/hashicorp.repo
  when: terraform_check.rc != 0
  tags: terraform

- name: Install Terraform
  ansible.builtin.yum:
    name: terraform
    state: present
  when: terraform_check.rc != 0
  tags: terraform

- name: Verify Terraform installation
  ansible.builtin.command: terraform version
  register: terraform_version
  changed_when: false
  tags: terraform

- name: Display Terraform version
  ansible.builtin.debug:
    var: terraform_version.stdout
  tags: terraform
