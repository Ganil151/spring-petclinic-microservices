---
# =============================================================================
# Terragrunt Role - tasks/main.yml
# =============================================================================

- name: Check if Terragrunt is already installed
  ansible.builtin.command: terragrunt --version
  register: terragrunt_check
  changed_when: false
  failed_when: false
  tags: terragrunt

- name: Download Terragrunt binary
  ansible.builtin.get_url:
    url: "https://github.com/gruntwork-io/terragrunt/releases/download/v{{ terragrunt_version | default('0.67.0') }}/terragrunt_linux_amd64"
    dest: /usr/local/bin/terragrunt
    mode: '0755'
    owner: root
    group: root
  when: terragrunt_check.rc != 0
  tags: terragrunt

- name: Verify Terragrunt installation
  ansible.builtin.command: terragrunt --version
  register: terragrunt_version_output
  changed_when: false
  tags: terragrunt

- name: Display Terragrunt version
  ansible.builtin.debug:
    var: terragrunt_version_output.stdout
  tags: terragrunt
