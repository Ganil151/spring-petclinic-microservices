---
# =============================================================================
# Common Role - tasks/main.yml
# =============================================================================

- name: Update system packages (RedHat)
  ansible.builtin.yum:
    name: '*'
    state: latest
    update_only: true
  when: ansible_os_family == "RedHat"
  tags: common

- name: Install essential utilities
  ansible.builtin.yum:
    name:
      - htop
      - iotop
      - nmap-ncat
      - telnet
      - jq
      - tree
      - vim-enhanced
      - bash-completion
      - yum-utils
    state: present
  tags: common

- name: Configure .bashrc for ec2-user
  ansible.builtin.copy:
    src: bashrc
    dest: /home/ec2-user/.bashrc
    owner: ec2-user
    group: ec2-user
    mode: '0644'
  tags: common

- name: Set up Message of the Day (MOTD)
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: '0644'
  tags: common

- name: Create project directory structure
  ansible.builtin.file:
    path: "/opt/spring-petclinic/{{ item }}"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'
  loop:
    - terraform
    - ansible
    - scripts
    - logs
  tags: common
