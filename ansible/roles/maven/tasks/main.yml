---
# =============================================================================
# Maven Role — tasks/main.yml
# Installs Apache Maven binary on Amazon Linux 2
# =============================================================================

- name: Check if Maven is already installed
  ansible.builtin.command: mvn -version
  register: maven_check
  changed_when: false
  failed_when: false
  tags: maven

- name: Set Maven variables
  ansible.builtin.set_fact:
    maven_version: "3.9.6"
    maven_home: "/opt/maven"
  tags: maven

- name: Download Apache Maven archive
  ansible.builtin.get_url:
    url: "https://archive.apache.org/dist/maven/maven-3/{{ maven_version }}/binaries/apache-maven-{{ maven_version }}-bin.tar.gz"
    dest: "/tmp/apache-maven-{{ maven_version }}-bin.tar.gz"
    mode: '0644'
  when: maven_check.rc != 0
  tags: maven

- name: Create Maven directory
  ansible.builtin.file:
    path: "{{ maven_home }}"
    state: directory
    mode: '0755'
  when: maven_check.rc != 0
  tags: maven

- name: Extract Maven archive
  ansible.builtin.unarchive:
    src: "/tmp/apache-maven-{{ maven_version }}-bin.tar.gz"
    dest: "{{ maven_home }}"
    remote_src: true
    extra_opts: [--strip-components=1]
  when: maven_check.rc != 0
  tags: maven

- name: Add Maven to global profile
  ansible.builtin.copy:
    dest: /etc/profile.d/maven.sh
    content: |
      export M2_HOME={{ maven_home }}
      export PATH=${M2_HOME}/bin:${PATH}
    mode: '0644'
  tags: maven

- name: Create symlink for mvn binary
  ansible.builtin.file:
    src: "{{ maven_home }}/bin/mvn"
    dest: /usr/local/bin/mvn
    state: link
  tags: maven

- name: Clean up Maven archive
  ansible.builtin.file:
    path: "/tmp/apache-maven-{{ maven_version }}-bin.tar.gz"
    state: absent
  tags: maven

- name: Verify Maven installation
  ansible.builtin.command: /usr/local/bin/mvn -version
  register: maven_version_check
  changed_when: false
  tags: maven

- name: Display Maven version
  ansible.builtin.debug:
    msg: "Maven installed: {{ maven_version_check.stdout_lines | first }}"
  tags: maven
