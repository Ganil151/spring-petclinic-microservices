---
# =============================================================================
# Java Role — tasks/main.yml
# Installs Amazon Corretto 21 (Java 21 LTS)
# =============================================================================

- name: Check if Java 21 is already installed
  ansible.builtin.command: java -version
  register: java_installed
  changed_when: false
  failed_when: false
  tags: java

- name: Add Amazon Corretto Repository (Amazon Linux 2)
  ansible.builtin.shell: rpm --import https://yum.corretto.aws/corretto.key && curl -L -o /etc/yum.repos.d/corretto.repo https://yum.corretto.aws/corretto.repo
  args:
    creates: /etc/yum.repos.d/corretto.repo
  tags: java

- name: Install Amazon Corretto 21
  ansible.builtin.yum:
    name: java-21-amazon-corretto-devel
    state: present
  when: java_installed.rc != 0 or '21' not in (java_installed.stderr | default(''))
  tags: java

- name: Set JAVA_HOME system-wide
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: "JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto"
    regexp: "^JAVA_HOME="
    create: true
    mode: '0644'
  tags: java

- name: Create JAVA_HOME profile script
  ansible.builtin.copy:
    dest: /etc/profile.d/java.sh
    content: |
      export JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto
      export PATH=$JAVA_HOME/bin:$PATH
    mode: '0644'
  tags: java

- name: Set java alternative
  ansible.builtin.command:
    cmd: alternatives --set java /usr/lib/jvm/java-21-amazon-corretto/bin/java
  changed_when: false
  failed_when: false
  tags: java

- name: Set javac alternative
  ansible.builtin.command:
    cmd: alternatives --set javac /usr/lib/jvm/java-21-amazon-corretto/bin/javac
  changed_when: false
  failed_when: false
  tags: java

- name: Verify Java installation
  ansible.builtin.command: java -version
  register: java_version_check
  changed_when: false
  tags: java

- name: Show Java version
  ansible.builtin.debug:
    msg: "Java installed: {{ java_version_check.stderr_lines | first | default('unknown') }}"
  tags: java
