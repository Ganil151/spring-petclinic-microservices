# =============================================================================
# Docker Role — tasks/main.yml (Amazon Linux 2 Optimized)
# =============================================================================

- name: Force cleanup of broken repos and YUM cache
  become: true
  block:
    - name: Remove the broken Docker repository file
      ansible.builtin.file:
        path: /etc/yum.repos.d/docker-ce.repo
        state: absent

    - name: Clean all yum metadata
      ansible.builtin.command: yum clean all
      # PROFESSOR'S NOTE: We removed any hidden 'warn' parameters 
      # and used the explicit command string.
      changed_when: true  # ← ADD: Explicitly declare state change

    - name: Remove yum cache directory
      ansible.builtin.file:
        path: /var/cache/yum
        state: absent
      # ← CONSIDER: This is aggressive; yum clean all usually suffices

- name: Remove old Docker versions
  ansible.builtin.yum:
    name:
      - docker
      - docker-common
      - docker-selinux  # ← NOTE: Package renamed to container-selinux on newer AL2
      - docker-engine
    state: absent
  tags: docker

- name: Install Docker via Amazon Extras
  ansible.builtin.command: amazon-linux-extras install docker -y
  args:
    creates: /usr/bin/docker  # ← GOOD: Idempotency guard
  tags: docker
  # ← CONSIDER: Use ansible.builtin.yum with name: docker and update_cache: yes
  #    for better Ansible-native integration and error handling

- name: Start and Enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  tags: docker

- name: Add user to docker group
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true
  tags: docker
  # ← ⚠️ SECURITY NOTE: docker group = root-equivalent access
  #    Document this risk in your security compliance docs

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version_output
  changed_when: false
  tags: docker
  # ← GOOD: Read-only check with proper changed_when declaration