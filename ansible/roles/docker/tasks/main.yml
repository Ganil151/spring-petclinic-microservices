---
# =============================================================================
# Docker Role — tasks/main.yml
# Installs and configures Docker CE on Amazon Linux 2/2023
# =============================================================================

- name: Gather OS facts for Docker repo selection
  ansible.builtin.set_fact:
    docker_repo_os: "{{ 
      (ansible_distribution == 'Amazon' and ansible_distribution_major_version == '2') | 
      ternary('rhel/7', 
      (ansible_distribution == 'Amazon' and ansible_distribution_major_version == '2023') | 
      ternary('rhel/8', 'rhel/9')) 
    }}"
  tags: docker

- name: Remove old Docker versions
  ansible.builtin.yum:
    name:
      - docker
      - docker-common
      - docker-selinux
      - docker-engine
    state: absent
    update_cache: true
  tags: docker

- name: Install yum-utils and dependencies
  ansible.builtin.yum:
    name:
      - yum-utils
      - device-mapper-persistent-data
      - lvm2
    state: present
    update_cache: true
  tags: docker

- name: Add Docker CE repository for Amazon Linux
  block:
    - name: Remove any existing Docker repo (to avoid conflicts)
      ansible.builtin.file:
        path: /etc/yum.repos.d/docker-ce.repo
        state: absent

    - name: Add Docker CE repository (RHEL-compatible for Amazon Linux)
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE Stable - Amazon Linux
        baseurl: "https://download.docker.com/linux/{{ docker_repo_os }}/$basearch/stable"
        enabled: true
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/rhel/gpg
        repo_gpgcheck: false
        module_hotfixes: true
      register: docker_repo_added

  rescue:
    - name: Fallback: Use direct RPM install if repo fails
      ansible.builtin.yum:
        name:
          - https://download.docker.com/linux/rhel/7/x86_64/stable/Packages/containerd.io-1.6.20-3.2.el7.x86_64.rpm
          - https://download.docker.com/linux/rhel/7/x86_64/stable/Packages/docker-ce-24.0.7-1.el7.x86_64.rpm
          - https://download.docker.com/linux/rhel/7/x86_64/stable/Packages/docker-ce-cli-24.0.7-1.el7.x86_64.rpm
        state: present
        disable_gpg_check: true
      when: docker_repo_added.failed | default(false)
  tags: docker

- name: Install Docker CE packages
  ansible.builtin.yum:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true
    disablerepo: "{{ docker_repo_added.failed | default(false) | ternary('docker-ce', '') }}"
  tags: docker

- name: Create Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'
  tags: docker

- name: Configure Docker daemon with systemd cgroup driver
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: '0644'
    backup: true
  notify: Restart Docker
  tags: docker

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true
  tags: docker

- name: Wait for Docker socket to be ready
  ansible.builtin.wait_for:
    path: /var/run/docker.sock
    timeout: 30
  tags: docker

- name: Create docker-compose symlink for compatibility
  ansible.builtin.file:
    src: /usr/libexec/docker/cli-plugins/docker-compose
    dest: /usr/local/bin/docker-compose
    state: link
    force: true
  ignore_errors: true  # May not exist in all versions
  tags: docker

- name: Add ec2-user to Docker group
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true
  tags: docker

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version_output
  changed_when: false
  tags: docker

- name: Show Docker version
  ansible.builtin.debug:
    msg: "✅ Docker installed: {{ docker_version_output.stdout }}"
  tags: docker