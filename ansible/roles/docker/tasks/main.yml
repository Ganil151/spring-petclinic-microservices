# =============================================================================
# Docker Role — tasks/main.yml (Amazon Linux 2 Optimized)
# =============================================================================

---
# =============================================================================
# Docker Role — tasks/main.yml (Fixed for Amazon Linux 2)
# =============================================================================

- name: Clean up broken CentOS Docker repo
  ansible.builtin.file:
    path: /etc/yum.repos.d/docker-ce.repo
    state: absent
  tags: docker

- name: Remove old Docker versions
  ansible.builtin.yum:
    name:
      - docker
      - docker-common
      - docker-selinux
      - docker-engine
    state: absent
  tags: docker

- name: Install Docker via amazon-linux-extras (The AWS Way)
  ansible.builtin.shell: "amazon-linux-extras install docker -y"
  args:
    creates: /usr/bin/docker
  tags: docker

- name: Install Docker Compose plugin
  ansible.builtin.yum:
    name: docker-compose-plugin
    state: present
  tags: docker

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  tags: docker

- name: Add ec2-user to Docker group
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true
  tags: docker

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version_output
  changed_when: false
  tags: docker

