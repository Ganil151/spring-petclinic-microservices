---
# =============================================================================
# Docker Role for Spring Petclinic Microservices
# =============================================================================
# Installs and configures Docker on Amazon Linux 2
# =============================================================================

- name: Install Docker
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  
  vars:
    docker_version: "latest"
    docker_storage_driver: "overlay2"
    docker_users:
      - ec2-user
    docker_daemon_options:
      storage-driver: overlay2
      log-driver: json-file
      log-opts:
        max-size: "10m"
        max-file: "3"
      live-restore: true
  
  tasks:
    - name: Display Docker installation start
      ansible.builtin.debug:
        msg: "Starting Docker installation on {{ inventory_hostname }}"
      tags: always

    - name: Remove old Docker versions
      ansible.builtin.yum:
        name:
          - docker
          - docker-common
          - docker-selinux
          - docker-engine
        state: absent
      tags: docker

    - name: Install yum-utils
      ansible.builtin.yum:
        name: yum-utils
        state: present
      tags: docker

    - name: Add Docker repository
      ansible.builtin.command:
        cmd: yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
        creates: /etc/yum.repos.d/docker-ce.repo
      tags: docker

    - name: Install Docker CE
      ansible.builtin.yum:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
      tags: docker

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
      tags: docker

    - name: Create Docker configuration directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: '0755'
      tags: docker

    - name: Configure Docker daemon
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "storage-driver": "{{ docker_storage_driver }}",
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            },
            "live-restore": true
          }
        mode: '0644'
      notify: Restart Docker
      tags: docker

    - name: Add users to Docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"
      tags: docker

    - name: Verify Docker installation
      ansible.builtin.command: docker --version
      register: docker_version_check
      changed_when: false
      tags: docker

    - name: Display Docker version
      ansible.builtin.debug:
        var: docker_version_check.stdout
      tags: docker

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
