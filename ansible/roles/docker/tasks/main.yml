# =============================================================================
# Docker Role — tasks/main.yml (Amazon Linux 2 Optimized)
# =============================================================================

- name: Force cleanup of broken repos and YUM cache
  become: true
  block:
    - name: Remove the broken Docker repository file
      ansible.builtin.file:
        path: /etc/yum.repos.d/docker-ce.repo
        state: absent

    - name: Clean all yum metadata
      ansible.builtin.command: yum clean all
      changed_when: true  

    - name: Remove yum cache directory
      ansible.builtin.file:
        path: /var/cache/yum
        state: absent

- name: Remove old Docker versions
  ansible.builtin.yum:
    name:
      - docker
      - docker-common
      - docker-selinux 
      - docker-engine
    state: absent
  tags: docker

- name: Install Docker via Amazon Extras
  ansible.builtin.command: amazon-linux-extras install docker -y
  args:
    creates: /usr/bin/docker  
  tags: docker

- name: Start and Enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  tags: docker

- name: Add user to docker group
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true
  tags: docker
  # ← ⚠️ SECURITY NOTE: docker group = root-equivalent access
  #    Document this risk in your security compliance docs

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version_output
  changed_when: false
  tags: docker
  # ← GOOD: Read-only check with proper changed_when declaration