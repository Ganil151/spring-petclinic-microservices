---
# =============================================================================
# Docker Role Handlers
# Purpose: Respond to configuration changes requiring service restarts
# =============================================================================


- name: Configure Docker daemon
  ansible.builtin.systemd:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: 
    name: docker
    state: restarted
    daemon_reload: true
