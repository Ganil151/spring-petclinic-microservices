---
# =============================================================================
# Docker Role Handlers
# Purpose: Respond to configuration changes requiring service restarts
# =============================================================================


- name: Configure Docker daemon
  ansible.builtin.systemd:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker
  tags: docker, never