# =============================================================================
# Ansible Configuration for Spring Petclinic Microservices
# =============================================================================

[defaults]
# --- Inventory & Paths ---
inventory = ./inventory/hosts
roles_path = ./roles
collections_path = ./collections
config_file = ./ansible.cfg

# --- Connection & Security ---
host_key_checking = False
timeout = 30
connect_timeout = 30

# --- Output & Logging (CI/CD Optimized) ---
stdout_callback = yaml
bin_ansible_callbacks = True
display_skipped_hosts = False
diff = True
log_path = /tmp/ansible.log
log_filter = *module_utils*
retry_files_enabled = False

# --- Performance & Caching ---
forks = 20
poll_interval = 5
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

# --- Temp Directories ---
local_tmp = /tmp/ansible-local-{{ user_id }}
remote_tmp = /tmp/ansible-${USER}/.ansible/tmp
system_tmpdir = /tmp

# --- Interpreter & Compatibility ---
interpreter_python = auto_silent
hash_behaviour = replace
private_role_vars = False
yaml_indentation = 2
max_diff_size = 104448

# --- Callback Plugins ---
callbacks_enabled = profile_tasks, timer

# --- Vault ---
vault_password_file = ./.vault_pass


[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
become_flags = -H -S -n -i


[persistent_connection]
connect_timeout = 30
command_timeout = 30
network_os = auto


[ssh_connection]
# --- SSH Optimization (Single Source of Truth) ---
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
retries = 3
transfer_method = smart


[inventory]
# --- Inventory Plugins ---
enable_plugins = auto, yaml, ini, aws_ec2
unparsed_is_failed = False
cache = True
cache_plugin = jsonfile
cache_connection = /tmp/ansible_inventory_cache
cache_timeout = 3600
cache_prefix = ansible_inventory_


[galaxy]
# --- Galaxy Configuration ---
server_list = release_galaxy
role_skeleton = ./roles/skeleton
ignore = .git,.github,.vscode,.idea,*.pyc,*.pyo,*.swp,*.swo,~,#*
display_progress = True


[galaxy_server.release_galaxy]
url = https://galaxy.ansible.com/
timeout = 60


[colors]
# --- Output Coloring for Readability ---
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = yellow
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan


[diff]
context = 3
always = False


[inventory_plugins.aws_ec2]
# --- AWS EC2 Dynamic Inventory ---
plugin = amazon.aws.aws_ec2
use_contrib_script_compatible_ec2_tag_keys = True