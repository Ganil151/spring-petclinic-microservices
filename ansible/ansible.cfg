# =============================================================================
# Ansible Configuration for Spring Petclinic Microservices
# =============================================================================

[defaults]
# Inventory
inventory = ./inventory/hosts
inventory_plugins = ./plugins

# Connection
host_key_checking = False
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# Timeout
timeout = 30
connect_timeout = 30

# Fact gathering
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

# Forks and polling
forks = 20
poll_interval = 5

# Output
stdout_callback = default
bin_ansible_callbacks = True
display_skipped_hosts = False
display_ok_hosts = True

# Diff mode
diff = True

# Vault
vault_password_file = ./.vault_pass

# Logging
log_path = /tmp/ansible.log
log_filter = *module_utils*

# Local temp directory
local_tmp = /tmp/ansible-local-{{ user_id }}

# Remote temp directory
remote_tmp = /tmp/ansible-${USER}/.ansible/tmp

# System temp directory
system_tmpdir = /tmp

# Roles path
roles_path = ./roles

# Collections path
collections_path = ./collections

# Library path
library = ./library

# Config file
config_file = ./ansible.cfg

# Executable
executable = /bin/sh

# Interpreter discovery
interpreter_python = auto_silent

# Private role variables
private_role_vars = False

# YAML indenting
yaml_indentation = 2

# Callback whitelist
callbacks_enabled = profile_tasks, timer

# Max file size for diff
max_diff_size = 104448

# Merge hash settings
hash_behaviour = replace

# Jinja2 native
# jinja2_native = True

# Retry files
retry_files_enabled = False

# Allow world readable tmp
allow_world_readable_tmp = False

# Ansible managed
# ansible_managed = Ansible managed: {file} modified on %Y-%m-%d %H:%M:%S by {uid} on {host}



[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
become_flags = -H -S -n -i


[persistent_connection]
connect_timeout = 30
command_timeout = 30
network_os = auto


[ssh_connection]
# SSH pipelining
pipelining = True

# SSH arguments
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

# Control path
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# Reconnection attempts
retries = 3

# Transfer method
transfer_method = smart


[inventory]
# Inventory plugins
enable_plugins = auto, yaml, ini, aws_ec2

# Unparsed groups
unparsed_is_failed = False

# Cache
cache = True
cache_plugin = jsonfile
cache_connection = /tmp/ansible_inventory_cache
cache_timeout = 3600
cache_prefix = ansible_inventory_


[galaxy]
# Galaxy server
server_list = release_galaxy

# Role skeleton
role_skeleton = ./roles/skeleton

# Ignore paths
ignore = .git,.github,.vscode,.idea,*.pyc,*.pyo,*.swp,*.swo,~,#*

# Display progress
display_progress = True


[galaxy_server.release_galaxy]
url = https://galaxy.ansible.com/
timeout = 60


[colors]
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = yellow
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan


[diff]
# Context lines
context = 3

# Always show diff
always = False


[inventory_plugins.aws_ec2]
# AWS EC2 inventory plugin defaults
plugin = amazon.aws.aws_ec2
use_contrib_script_compatible_ec2_tag_keys = True
