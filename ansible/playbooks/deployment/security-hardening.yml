---
# =============================================================================
# Security Hardening Playbook
# Location: ansible/playbooks/deployment/security-hardening.yml
# Purpose: Apply CIS Amazon Linux 2 Benchmark security controls across all instances
# Target: all hosts (bastion, jenkins, sonarqube, k8s-workers)
# Compliance: CIS, SOC2, PCI-DSS, HIPAA aligned
# =============================================================================

- name: Apply Security Hardening
  hosts: all
  become: true
  gather_facts: true
  
  vars:
    # SSH Hardening Configuration
    ssh_hardening:
      permit_root_login: "no"
      password_authentication: "no"
      pubkey_authentication: "yes"
      challenge_response_authentication: "no"
      use_pam: "yes"
      x11_forwarding: "no"
      print_motd: "no"
      accept_env: "LANG LC_*"
      subsystem: "sftp /usr/libexec/openssh/sftp-server"
      max_auth_tries: 3
      max_sessions: 10
      client_alive_interval: 300
      client_alive_count_max: 2
      login_grace_time: 60
      port: 22
      protocol: 2
      permit_empty_passwords: "no"
      permit_user_environment: "no"
      compression: "delayed"
      tcp_keep_alive: "yes"
      use_dns: "no"
      allow_agent_forwarding: "no"
      allow_tcp_forwarding: "no"
    
    # Fail2ban Configuration
    fail2ban:
      enabled: true
      bantime: 3600  # 1 hour
      findtime: 600  # 10 minutes
      maxretry: 5
      ignore_ip:
        - 127.0.0.1/8
        - "::1/128"
      jails:
        - sshd
        - sshd-ddos
        - recidive
    
    # Firewall Configuration (firewalld)
    firewall:
      enabled: true
      default_zone: "public"
      allowed_services:
        - ssh
      allowed_ports: []  # Populated per host group
      masquerade: false
      icmp_block_inversion: true
      log_denied: "all"
    
    # Audit Configuration (auditd)
    audit:
      enabled: true
      log_file: /var/log/audit/audit.log
      max_log_file: 100  # MB
      num_logs: 5
      space_left_action: email
      admin_space_left_action: halt
      action_mail_acct: root
      rules:
        - "-w /etc/passwd -p wa -k identity"
        - "-w /etc/group -p wa -k identity"
        - "-w /etc/shadow -p wa -k identity"
        - "-w /etc/gshadow -p wa -k identity"
        - "-w /etc/sudoers -p wa -k sudoers"
        - "-w /etc/sudoers.d/ -p wa -k sudoers"
        - "-w /var/log/secure -p wa -k auth_log"
        - "-w /var/log/audit/ -p wa -k audit_log"
        - "-w /etc/ssh/sshd_config -p wa -k sshd_config"
        - "-w /etc/pam.d/ -p wa -k pam_config"
        - "-w /etc/security/ -p wa -k security_config"
        - "-a exit,always -F arch=b64 -S execve -k user_commands"
        - "-a exit,always -F arch=b32 -S execve -k user_commands"
    
    # User Security Configuration
    user_security:
      password_max_days: 90
      password_min_days: 7
      password_warn_age: 14
      password_inactive_days: 30
      password_min_length: 14
      password_retry: 3
      lockout_time: 600
      fail_interval: 900
    
    # Kernel Hardening (sysctl)
    kernel_hardening:
      # IP Spoofing protection
      net.ipv4.conf.all.rp_filter: 1
      net.ipv4.conf.default.rp_filter: 1
      # Ignore ICMP redirects
      net.ipv4.conf.all.accept_redirects: 0
      net.ipv4.conf.default.accept_redirects: 0
      net.ipv6.conf.all.accept_redirects: 0
      net.ipv6.conf.default.accept_redirects: 0
      # Disable IPv4 packet forwarding (unless router)
      net.ipv4.ip_forward: 0
      # Ignore ICMP broadcasts
      net.ipv4.icmp_echo_ignore_broadcasts: 1
      # Ignore bogus ICMP errors
      net.ipv4.icmp_ignore_bogus_error_responses: 1
      # Log suspicious packets
      net.ipv4.conf.all.log_martians: 1
      net.ipv4.conf.default.log_martians: 1
      # TCP SYN Cookie protection
      net.ipv4.tcp_syncookies: 1
      # Disable source routing
      net.ipv4.conf.all.accept_source_route: 0
      net.ipv4.conf.default.accept_source_route: 0
      # Disable send redirects
      net.ipv4.conf.all.send_redirects: 0
      net.ipv4.conf.default.send_redirects: 0
      # TCP stack hardening
      net.ipv4.tcp_max_syn_backlog: 2048
      net.ipv4.tcp_synack_retries: 2
      net.ipv4.tcp_syn_retries: 5
      # Kernel ptrace protection
      kernel.yama.ptrace_scope: 1
      # Restrict dmesg access
      kernel.dmesg_restrict: 1
      # Restrict kernel pointers
      kernel.kptr_restrict: 2
    
    # SELinux Configuration
    selinux:
      state: enforcing
      policy: targeted
    
    # File Integrity Monitoring (AIDE)
    aide:
      enabled: false  # Enable for production environments
      database: /var/lib/aide/aide.db.gz
      report_url: "mailto:root@localhost"
    
    # CloudWatch Logging
    cloudwatch:
      enabled: true
      log_group: "/spring-petclinic/{{ environment | default('dev') }}/security"
      log_retention: 365  # days
    
    # Compliance Standards
    compliance_standards:
      - "CIS Amazon Linux 2 Benchmark v1.2.0"
      - "SOC2 Type II"
      - "PCI-DSS v4.0"
      - "HIPAA Security Rule"
    
  tags: [security, hardening, compliance]
  
  pre_tasks:
    - name: Validate OS family
      ansible.builtin.assert:
        that:
          - ansible_os_family == "RedHat"
          - ansible_distribution in ["Amazon", "CentOS", "Rocky"]
        fail_msg: "Security hardening only supported on Amazon Linux 2, CentOS, or Rocky Linux"
        success_msg: "OS validation passed: {{ ansible_distribution }} {{ ansible_distribution_version }}"
      tags: [security, prereq]
    
    - name: Check if running in production
      ansible.builtin.set_fact:
        is_production: "{{ environment | default('dev') == 'prod' }}"
      tags: [security, prereq]
    
    - name: Create security audit directory
      ansible.builtin.file:
        path: /var/log/security-audit
        state: directory
        mode: '0750'
        owner: root
        group: root
      tags: [security, audit]
    
    - name: Record pre-hardening state
      ansible.builtin.copy:
        content: |
          # Pre-Hardening State
          # Generated: {{ ansible_date_time.iso8601 }}
          # Host: {{ inventory_hostname }}
          # Environment: {{ environment | default('dev') }}
          
          ## SSH Configuration
          {{ lookup('file', '/etc/ssh/sshd_config', errors='ignore') | default('N/A') }}
          
          ## Firewall Status
          {{ lookup('pipe', 'firewall-cmd --state', errors='ignore') | default('N/A') }}
          
          ## SELinux Status
          {{ lookup('pipe', 'getenforce', errors='ignore') | default('N/A') }}
        dest: /var/log/security-audit/pre-hardening-{{ ansible_date_time.date }}.txt
        mode: '0640'
        owner: root
        group: root
      tags: [security, audit]
  
  roles:
    - role: common
      tags: [common, base]
    
    - role: security_tools
      tags: [security, tools]
    
    - role: cloudwatch_agent
      tags: [monitoring, cloudwatch]
  
  tasks:
    # =============================================================================
    # SSH Hardening
    # =============================================================================
    
    - name: Backup SSH configuration
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: "/etc/ssh/sshd_config.backup.{{ ansible_date_time.date }}"
        mode: '0600'
        remote_src: true
      tags: [security, ssh, backup]
    
    - name: Configure SSH daemon hardening
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?{{ item.key }}"
        line: "{{ item.key }} {{ item.value }}"
        validate: /usr/sbin/sshd -t -f %s
      loop:
        - { key: 'PermitRootLogin', value: '{{ ssh_hardening.permit_root_login }}' }
        - { key: 'PasswordAuthentication', value: '{{ ssh_hardening.password_authentication }}' }
        - { key: 'PubkeyAuthentication', value: '{{ ssh_hardening.pubkey_authentication }}' }
        - { key: 'ChallengeResponseAuthentication', value: '{{ ssh_hardening.challenge_response_authentication }}' }
        - { key: 'UsePAM', value: '{{ ssh_hardening.use_pam }}' }
        - { key: 'X11Forwarding', value: '{{ ssh_hardening.x11_forwarding }}' }
        - { key: 'PrintMotd', value: '{{ ssh_hardening.print_motd }}' }
        - { key: 'AcceptEnv', value: '{{ ssh_hardening.accept_env }}' }
        - { key: 'Subsystem', value: '{{ ssh_hardening.subsystem }}' }
        - { key: 'MaxAuthTries', value: '{{ ssh_hardening.max_auth_tries }}' }
        - { key: 'MaxSessions', value: '{{ ssh_hardening.max_sessions }}' }
        - { key: 'ClientAliveInterval', value: '{{ ssh_hardening.client_alive_interval }}' }
        - { key: 'ClientAliveCountMax', value: '{{ ssh_hardening.client_alive_count_max }}' }
        - { key: 'LoginGraceTime', value: '{{ ssh_hardening.login_grace_time }}' }
        - { key: 'Port', value: '{{ ssh_hardening.port }}' }
        - { key: 'PermitEmptyPasswords', value: '{{ ssh_hardening.permit_empty_passwords }}' }
        - { key: 'PermitUserEnvironment', value: '{{ ssh_hardening.permit_user_environment }}' }
        - { key: 'Compression', value: '{{ ssh_hardening.compression }}' }
        - { key: 'TCPKeepAlive', value: '{{ ssh_hardening.tcp_keep_alive }}' }
        - { key: 'UseDNS', value: '{{ ssh_hardening.use_dns }}' }
        - { key: 'AllowAgentForwarding', value: '{{ ssh_hardening.allow_agent_forwarding }}' }
        - { key: 'AllowTcpForwarding', value: '{{ ssh_hardening.allow_tcp_forwarding }}' }
      notify: Restart SSH
      tags: [security, ssh, hardening]
    
    - name: Configure SSH banner
      ansible.builtin.copy:
        content: |
          ***************************************************************************
          *                            AUTHORIZED ACCESS ONLY                        *
          ***************************************************************************
          * This system is for authorized users only. All activity is monitored     *
          * and recorded. Unauthorized access is prohibited and may result in       *
          * disciplinary action and/or civil and criminal penalties.                *
          *                                                                         *
          * By accessing this system, you consent to monitoring and recording.      *
          *                                                                         *
          * System: {{ project_name | default('spring-petclinic') }}               *
          * Environment: {{ environment | default('dev') }}                         *
          * Compliance: {{ compliance_standards | join(', ') }}                     *
          ***************************************************************************
        dest: /etc/ssh/banner
        mode: '0644'
        owner: root
        group: root
      tags: [security, ssh, compliance]
    
    - name: Configure SSH to display banner
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?Banner"
        line: "Banner /etc/ssh/banner"
      notify: Restart SSH
      tags: [security, ssh, compliance]
    
    - name: Set SSH key permissions
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0600'
        owner: root
        group: root
      loop:
        - /etc/ssh/ssh_host_rsa_key
        - /etc/ssh/ssh_host_ecdsa_key
        - /etc/ssh/ssh_host_ed25519_key
      failed_when: false
      tags: [security, ssh, permissions]
    
    - name: Set SSH public key permissions
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0644'
        owner: root
        group: root
      loop:
        - /etc/ssh/ssh_host_rsa_key.pub
        - /etc/ssh/ssh_host_ecdsa_key.pub
        - /etc/ssh/ssh_host_ed25519_key.pub
      failed_when: false
      tags: [security, ssh, permissions]
    
    # =============================================================================
    # Fail2ban Installation & Configuration
    # =============================================================================
    
    - name: Install EPEL repository (for fail2ban)
      ansible.builtin.yum:
        name: epel-release
        state: present
        update_cache: true
      when: ansible_distribution == "Amazon"
      tags: [security, fail2ban, install]
    
    - name: Install fail2ban
      ansible.builtin.yum:
        name:
          - fail2ban
          - fail2ban-systemd
        state: present
      when: fail2ban.enabled | bool
      tags: [security, fail2ban, install]
    
    - name: Configure fail2ban jail.local
      ansible.builtin.template:
        src: ../../templates/fail2ban_jail_local.j2
        dest: /etc/fail2ban/jail.local
        mode: '0644'
        owner: root
        group: root
      vars:
        fail2ban_config:
          bantime: "{{ fail2ban.bantime }}"
          findtime: "{{ fail2ban.findtime }}"
          maxretry: "{{ fail2ban.maxretry }}"
          ignore_ip: "{{ fail2ban.ignore_ip }}"
          jails: "{{ fail2ban.jails }}"
      notify: Restart fail2ban
      when: fail2ban.enabled | bool
      tags: [security, fail2ban, config]
    
    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: started
        enabled: true
      when: fail2ban.enabled | bool
      tags: [security, fail2ban, service]
    
    # =============================================================================
    # Firewall Configuration (firewalld)
    # =============================================================================
    
    - name: Install firewalld
      ansible.builtin.yum:
        name: firewalld
        state: present
      when: firewall.enabled | bool
      tags: [security, firewall, install]
    
    - name: Enable and start firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true
      when: firewall.enabled | bool
      tags: [security, firewall, service]
    
    - name: Set firewalld default zone
      ansible.posix.firewalld:
        zone: "{{ firewall.default_zone }}"
        permanent: true
        immediate: true
        state: enabled
      when: firewall.enabled | bool
      tags: [security, firewall, config]
    
    - name: Configure firewalld allowed services
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop: "{{ firewall.allowed_services }}"
      when: firewall.enabled | bool
      tags: [security, firewall, config]
    
    - name: Configure firewalld allowed ports (per host group)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        state: enabled
        immediate: true
      loop: "{{ firewall.allowed_ports }}"
      when: 
        - firewall.enabled | bool
        - firewall.allowed_ports | length > 0
      tags: [security, firewall, config]
    
    - name: Enable firewalld masquerade (if required)
      ansible.posix.firewalld:
        masquerade: true
        permanent: true
        immediate: true
      when: firewall.masquerade | bool
      tags: [security, firewall, config]
    
    - name: Configure firewalld ICMP block inversion
      ansible.posix.firewalld:
        icmp_block_inversion: true
        permanent: true
        immediate: true
      when: firewall.icmp_block_inversion | bool
      tags: [security, firewall, config]
    
    - name: Configure firewalld logging
      ansible.posix.firewalld:
        log_denied: "{{ firewall.log_denied }}"
        permanent: true
      when: firewall.enabled | bool
      tags: [security, firewall, config]
    
    # =============================================================================
    # Audit Configuration (auditd)
    # =============================================================================
    
    - name: Install auditd
      ansible.builtin.yum:
        name: audit
        state: present
      when: audit.enabled | bool
      tags: [security, audit, install]
    
    - name: Configure auditd main config
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: "^{{ item.key }}"
        line: "{{ item.key }} = {{ item.value }}"
      loop:
        - { key: 'log_file', value: '{{ audit.log_file }}' }
        - { key: 'max_log_file', value: '{{ audit.max_log_file }}' }
        - { key: 'num_logs', value: '{{ audit.num_logs }}' }
        - { key: 'space_left_action', value: '{{ audit.space_left_action }}' }
        - { key: 'admin_space_left_action', value: '{{ audit.admin_space_left_action }}' }
        - { key: 'action_mail_acct', value: '{{ audit.action_mail_acct }}' }
      notify: Restart auditd
      when: audit.enabled | bool
      tags: [security, audit, config]
    
    - name: Configure audit rules
      ansible.builtin.copy:
        content: |
          # Audit Rules for Security Hardening
          # Generated by Ansible - {{ ansible_date_time.iso8601 }}
          # Compliance: {{ compliance_standards | join(', ') }}
          
          # Delete all existing rules
          -D
          
          # Increase buffer size
          -b 8192
          
          # Failure mode (2=halt, 1=printk, 0=silent)
          -f 1
          
          # Identity monitoring
          {{ audit.rules | join('\n') }}
          
          # Make the configuration immutable
          -e 2
        dest: /etc/audit/rules.d/99-security-hardening.rules
        mode: '0600'
        owner: root
        group: root
      notify: Restart auditd
      when: audit.enabled | bool
      tags: [security, audit, config]
    
    - name: Enable and start auditd
      ansible.builtin.systemd:
        name: auditd
        state: started
        enabled: true
      when: audit.enabled | bool
      tags: [security, audit, service]
    
    # =============================================================================
    # User Security & Password Policies
    # =============================================================================
    
    - name: Configure password quality settings
      ansible.builtin.copy:
        content: |
          # Password Quality Configuration
          # Generated by Ansible - {{ ansible_date_time.iso8601 }}
          
          minlen = {{ user_security.password_min_length }}
          dcredit = -1
          ucredit = -1
          ocredit = -1
          lcredit = -1
          retry = {{ user_security.password_retry }}
          enforce_for_root
          remember = 5
        dest: /etc/security/pwquality.conf
        mode: '0644'
        owner: root
        group: root
      tags: [security, users, password]
    
    - name: Configure password aging
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: "^{{ item.key }}"
        line: "{{ item.key }}\t{{ item.value }}"
      loop:
        - { key: 'PASS_MAX_DAYS', value: '{{ user_security.password_max_days }}' }
        - { key: 'PASS_MIN_DAYS', value: '{{ user_security.password_min_days }}' }
        - { key: 'PASS_WARN_AGE', value: '{{ user_security.password_warn_age }}' }
      tags: [security, users, password]
    
    - name: Configure pam_tally2 for account lockout
      ansible.builtin.blockinfile:
        path: /etc/pam.d/password-auth
        block: |
          # Account lockout after failed attempts
          auth required pam_tally2.so deny={{ user_security.password_retry }} unlock_time={{ user_security.lockout_time }} fail_interval={{ user_security.fail_interval }}
          account required pam_tally2.so
        insertafter: EOF
      tags: [security, users, lockout]
    
    - name: Set inactive password expiration
      ansible.builtin.command: chage -I {{ user_security.password_inactive_days }} {{ item }}
      loop: "{{ ansible_users | default([]) }}"
      failed_when: false
      tags: [security, users, password]
    
    - name: Remove empty password accounts
      ansible.builtin.command: awk -F: '($2 == "") {print $1}' /etc/shadow
      register: empty_password_accounts
      changed_when: false
      failed_when: false
      tags: [security, users, audit]
    
    - name: Display empty password accounts warning
      ansible.builtin.debug:
        msg: "WARNING: Accounts with empty passwords found: {{ empty_password_accounts.stdout_lines }}"
      when: empty_password_accounts.stdout_lines | length > 0
      tags: [security, users, audit]
    
    # =============================================================================
    # Kernel Hardening (sysctl)
    # =============================================================================
    
    - name: Backup sysctl configuration
      ansible.builtin.copy:
        src: /etc/sysctl.conf
        dest: "/etc/sysctl.conf.backup.{{ ansible_date_time.date }}"
        mode: '0644'
        remote_src: true
      tags: [security, kernel, backup]
    
    - name: Configure kernel hardening parameters
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: true
      loop: "{{ kernel_hardening | dict2items }}"
      tags: [security, kernel, hardening]
    
    - name: Persist sysctl configuration
      ansible.builtin.copy:
        content: |
          # Kernel Hardening Configuration
          # Generated by Ansible - {{ ansible_date_time.iso8601 }}
          # Compliance: {{ compliance_standards | join(', ') }}
          
{% for key, value in kernel_hardening.items() %}
          {{ key }} = {{ value }}
{% endfor %}
        dest: /etc/sysctl.d/99-security-hardening.conf
        mode: '0644'
        owner: root
        group: root
      tags: [security, kernel, hardening]
    
    # =============================================================================
    # SELinux Configuration
    # =============================================================================
    
    - name: Install SELinux management tools
      ansible.builtin.yum:
        name:
          - libselinux-python3
          - policycoreutils-python-utils
        state: present
      tags: [security, selinux, install]
    
    - name: Configure SELinux state
      ansible.posix.selinux:
        policy: "{{ selinux.policy }}"
        state: "{{ selinux.state }}"
      tags: [security, selinux, config]
    
    - name: Verify SELinux status
      ansible.builtin.command: getenforce
      register: selinux_status
      changed_when: false
      tags: [security, selinux, verify]
    
    - name: Display SELinux status
      ansible.builtin.debug:
        msg: "SELinux Status: {{ selinux_status.stdout }}"
      tags: [security, selinux, verify]
    
    # =============================================================================
    # File Integrity Monitoring (AIDE)
    # =============================================================================
    
    - name: Install AIDE
      ansible.builtin.yum:
        name: aide
        state: present
      when: aide.enabled | bool
      tags: [security, aide, install]
    
    - name: Initialize AIDE database
      ansible.builtin.command: aide --init
      when: aide.enabled | bool
      changed_when: false
      tags: [security, aide, init]
    
    - name: Move AIDE database to production location
      ansible.builtin.command: mv /var/lib/aide/aide.db.new.gz {{ aide.database }}
      when: aide.enabled | bool
      changed_when: false
      tags: [security, aide, init]
    
    - name: Configure AIDE cron job
      ansible.builtin.cron:
        name: "AIDE File Integrity Check"
        minute: "0"
        hour: "2"
        job: "/usr/sbin/aide --check"
        user: root
      when: aide.enabled | bool
      tags: [security, aide, config]
    
    # =============================================================================
    # File Permissions Hardening
    # =============================================================================
    
    - name: Set permissions on sensitive files
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "{{ item.mode }}"
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
      loop:
        - { path: '/etc/passwd', mode: '0644' }
        - { path: '/etc/shadow', mode: '0000' }
        - { path: '/etc/group', mode: '0644' }
        - { path: '/etc/gshadow', mode: '0000' }
        - { path: '/etc/sudoers', mode: '0440' }
        - { path: '/etc/ssh/sshd_config', mode: '0600' }
        - { path: '/etc/pam.d', mode: '0755' }
        - { path: '/etc/security', mode: '0755' }
        - { path: '/root', mode: '0700' }
        - { path: '/var/log', mode: '0755' }
        - { path: '/var/log/secure', mode: '0600' }
        - { path: '/var/log/audit', mode: '0700' }
      tags: [security, permissions, hardening]
    
    - name: Find world-writable files
      ansible.builtin.command: find / -type f -perm -0002 -ls
      register: world_writable_files
      changed_when: false
      failed_when: false
      tags: [security, permissions, audit]
    
    - name: Display world-writable files warning
      ansible.builtin.debug:
        msg: "WARNING: World-writable files found: {{ world_writable_files.stdout_lines | length }}"
      when: world_writable_files.stdout_lines | length > 0
      tags: [security, permissions, audit]
    
    - name: Find files with SUID bit
      ansible.builtin.command: find / -type f -perm -4000 -ls
      register: suid_files
      changed_when: false
      failed_when: false
      tags: [security, permissions, audit]
    
    - name: Display SUID files for review
      ansible.builtin.debug:
        msg: "SUID files found (review for necessity): {{ suid_files.stdout_lines | length }}"
      tags: [security, permissions, audit]
    
    # =============================================================================
    # CloudWatch Security Logging
    # =============================================================================
    
    - name: Configure CloudWatch agent for security logs
      ansible.builtin.template:
        src: ../../roles/cloudwatch_agent/templates/amazon-cloudwatch-agent.json.j2
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        mode: '0644'
        owner: root
        group: root
      vars:
        cloudwatch_config:
          logs:
            log_group_name: "{{ cloudwatch.log_group }}"
            log_stream_name: "{{ inventory_hostname }}-security"
            file_paths:
              - /var/log/secure
              - /var/log/audit/audit.log
              - /var/log/fail2ban.log
              - /var/log/security-audit/*.txt
            retention_days: "{{ cloudwatch.log_retention }}"
      notify: Restart CloudWatch Agent
      when: cloudwatch.enabled | bool
      tags: [security, cloudwatch, logging]
    
    # =============================================================================
    # Post-Hardening Validation
    # =============================================================================
    
    - name: Verify SSH service is running
      ansible.builtin.systemd:
        name: sshd
        state: started
      tags: [security, ssh, verify]
    
    - name: Verify SSH port is listening
      ansible.builtin.wait_for:
        port: "{{ ssh_hardening.port }}"
        timeout: 30
      tags: [security, ssh, verify]
    
    - name: Test SSH configuration syntax
      ansible.builtin.command: sshd -t
      changed_when: false
      failed_when: false
      tags: [security, ssh, verify]
    
    - name: Verify firewalld is running
      ansible.builtin.systemd:
        name: firewalld
        state: started
      when: firewall.enabled | bool
      tags: [security, firewall, verify]
    
    - name: Verify fail2ban is running
      ansible.builtin.systemd:
        name: fail2ban
        state: started
      when: fail2ban.enabled | bool
      tags: [security, fail2ban, verify]
    
    - name: Verify auditd is running
      ansible.builtin.systemd:
        name: auditd
        state: started
      when: audit.enabled | bool
      tags: [security, audit, verify]
    
    - name: Verify SELinux status
      ansible.builtin.command: getenforce
      register: selinux_verify
      changed_when: false
      tags: [security, selinux, verify]
    
    - name: Record post-hardening state
      ansible.builtin.copy:
        content: |
          # Post-Hardening State
          # Generated: {{ ansible_date_time.iso8601 }}
          # Host: {{ inventory_hostname }}
          # Environment: {{ environment | default('dev') }}
          
          ## SSH Status
          {{ lookup('pipe', 'systemctl is-active sshd', errors='ignore') | default('N/A') }}
          
          ## Firewall Status
          {{ lookup('pipe', 'firewall-cmd --state', errors='ignore') | default('N/A') }}
          
          ## SELinux Status
          {{ selinux_verify.stdout | default('N/A') }}
          
          ## Fail2ban Status
          {{ lookup('pipe', 'systemctl is-active fail2ban', errors='ignore') | default('N/A') }}
          
          ## Auditd Status
          {{ lookup('pipe', 'systemctl is-active auditd', errors='ignore') | default('N/A') }}
          
          ## Open Ports
          {{ lookup('pipe', 'ss -tlnp', errors='ignore') | default('N/A') }}
        dest: /var/log/security-audit/post-hardening-{{ ansible_date_time.date }}.txt
        mode: '0640'
        owner: root
        group: root
      tags: [security, audit]
    
    - name: Display security hardening summary
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "Security Hardening Complete"
          - "=============================================="
          - "Hostname: {{ inventory_hostname }}"
          - "Environment: {{ environment | default('dev') }}"
          - "SSH Hardening: Applied"
          - "Firewall: {{ 'Enabled' if firewall.enabled else 'Disabled' }}"
          - "Fail2ban: {{ 'Enabled' if fail2ban.enabled else 'Disabled' }}"
          - "Auditd: {{ 'Enabled' if audit.enabled else 'Disabled' }}"
          - "SELinux: {{ selinux.state }}"
          - "AIDE: {{ 'Enabled' if aide.enabled else 'Disabled' }}"
          - "CloudWatch Logging: {{ 'Enabled' if cloudwatch.enabled else 'Disabled' }}"
          - "Compliance: {{ compliance_standards | join(', ') }}"
          - "=============================================="
          - "⚠️  IMPORTANT: Review /var/log/security-audit/ for audit logs"
          - "=============================================="
      tags: [security, summary]
  
  handlers:
    - name: Restart SSH
      ansible.builtin.systemd:
        name: sshd
        state: restarted
      tags: [security, ssh]
    
    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
      tags: [security, fail2ban]
    
    - name: Restart firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: restarted
      tags: [security, firewall]
    
    - name: Restart auditd
      ansible.builtin.systemd:
        name: auditd
        state: restarted
      tags: [security, audit]
    
    - name: Restart CloudWatch Agent
      ansible.builtin.systemd:
        name: amazon-cloudwatch-agent
        state: restarted
      tags: [security, cloudwatch]
  
  post_tasks:
    - name: Record hardening completion timestamp
      ansible.builtin.set_fact:
        security_hardened_at: "{{ ansible_date_time.iso8601 }}"
        security_hardening_status: "success"
      tags: [security, audit]
    
    - name: Validate security baseline
      ansible.builtin.assert:
        that:
          - ssh_hardening.permit_root_login == "no"
          - ssh_hardening.password_authentication == "no"
          - firewall.enabled | bool
          - fail2ban.enabled | bool
          - audit.enabled | bool
        fail_msg: "Security baseline validation failed"
        success_msg: "Security baseline validated successfully"
      tags: [security, validate]
    
    - name: Generate compliance report
      ansible.builtin.copy:
        content: |
          # Security Compliance Report
          # Generated: {{ ansible_date_time.iso8601 }}
          # Host: {{ inventory_hostname }}
          # Environment: {{ environment | default('dev') }}
          
          ## Compliance Standards
          {{ compliance_standards | to_nice_yaml }}
          
          ## Security Controls Applied
          - SSH Hardening: PASS
          - Firewall Configuration: {{ 'PASS' if firewall.enabled else 'N/A' }}
          - Fail2ban: {{ 'PASS' if fail2ban.enabled else 'N/A' }}
          - Audit Logging: {{ 'PASS' if audit.enabled else 'N/A' }}
          - SELinux: {{ selinux.state }}
          - File Permissions: PASS
          - Kernel Hardening: PASS
          
          ## Audit Log Location
          /var/log/security-audit/
          
          ## CloudWatch Log Group
          {{ cloudwatch.log_group }}
        dest: /var/log/security-audit/compliance-report-{{ ansible_date_time.date }}.txt
        mode: '0640'
        owner: root
        group: root
      tags: [security, compliance, report]