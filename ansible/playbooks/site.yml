---
# =============================================================================
# Spring Petclinic Microservices - Main Site Playbook
# Location: ansible/playbooks/site.yml
# Purpose: Orchestrates the entire infrastructure configuration via Ansible
# Architecture: Terraform/Terragrunt provisions infra → Ansible configures instances
# =============================================================================

- name: 01. Pre-flight Checks
  hosts: all
  gather_facts: false
  tags: [always, preflight]
  tasks:
    - name: Wait for system readiness (SSH)
      ansible.builtin.wait_for_connection:
        timeout: 300
    
    - name: Gather facts after connection
      ansible.builtin.setup:

    - name: Validate OS Family
      ansible.builtin.assert:
        that: ansible_os_family == "RedHat"
        fail_msg: "Only RedHat family (Amazon Linux 2) is supported."
        success_msg: "OS validation passed: {{ ansible_distribution }} {{ ansible_distribution_version }}"

- name: 02. Base Infrastructure (Common & Security)
  import_playbook: provisioning/prerequisites.yml
  tags: [common, security, infra]

- name: 03. Bastion Host Configuration
  import_playbook: deployment/bastion-setup.yml
  tags: [bastion, tools]

- name: 04. Jenkins Master Deployment
  import_playbook: deployment/jenkins-setup.yml
  tags: [jenkins, cicd]

- name: 05. SonarQube Server Deployment
  hosts: sonarqube_servers
  become: true
  roles:
    - role: sonarqube
      tags: [sonarqube, quality]
  tags: [sonarqube, quality]

- name: 06. Kubernetes Cluster Configuration
  import_playbook: provisioning/k8s-cluster.yml
  tags: [k8s, kubernetes]

- name: 07. GitOps & Security Integration
  hosts: all
  become: true
  tasks:
    - name: Install Trivy Scan
      ansible.builtin.include_role:
        name: trivy_scan
      when: "'jenkins_masters' in group_names"
      tags: [trivy, security]
    
    - name: Install Vault Integration
      ansible.builtin.include_role:
        name: vault_integration
      tags: [vault, secrets]

- name: 08. Deployment Summary
  hosts: localhost
  gather_facts: false
  tags: [always, summary]
  tasks:
    - name: Display deployment message
      ansible.builtin.debug:
        msg: 
          - "=============================================="
          - "Full infrastructure configuration for {{ app_env | upper }} complete!"
          - "=============================================="
          - "Environment: {{ app_env | default('dev') }}"
          - "Region: {{ aws_region | default('us-east-1') }}"
          - "Project: {{ project_name | default('spring-petclinic') }}"
          - "=============================================="
