apiVersion: apps/v1
kind: Deployment
metadata:
  name: vets-service
  namespace: spring-petclinic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vets-service
  template:
    metadata:
      labels:
        app: vets-service
    spec:
      containers:
      - name: vets-service
        image: spring-petclinic-vets-service:latest
        ports:
        - containerPort: 8082
        envFrom:
        - configMapRef:
            name: spring-petclinic-common-config
        resources:
          requests:
            memory: "768Mi"
            cpu: "500m"
          limits:
            memory: "1.5Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: vets-service
  namespace: spring-petclinic
spec:
  selector:
    app: vets-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP # In AWS/EKS, this creates an ELB
