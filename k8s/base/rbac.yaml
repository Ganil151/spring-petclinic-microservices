apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: spring-petclinic
  name: petclinic-role
rules:
- apiGroups: [""]
  resources: ["services", "endpoints", "pods", "configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: petclinic-role-binding
  namespace: spring-petclinic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: petclinic-role
subjects:
- kind: ServiceAccount
  name: default
  namespace: spring-petclinic
