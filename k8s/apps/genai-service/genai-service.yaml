apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-service
  namespace: spring-petclinic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genai-service
  template:
    metadata:
      labels:
        app: genai-service
    spec:
      containers:
      - name: genai-service
        image: spring-petclinic-genai-service:latest
        ports:
        - containerPort: 8084
        envFrom:
        - configMapRef:
            name: spring-petclinic-common-config
        resources:
          requests:
            memory: "768Mi"
            cpu: "500m"
          limits:
            memory: "1.5Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 808480
          initialDelaySeconds: 60
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: genai-service
  namespace: spring-petclinic
spec:
  selector:
    app: genai-service
  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084
  type: ClusterIP # In AWS/EKS, this creates an ELB
