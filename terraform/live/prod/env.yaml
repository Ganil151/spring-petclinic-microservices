# Global Network
env: "prod"
vpc_cidr: "10.2.0.0/16"

# Standalone Management Instance
instances:
  jenkins_master:
   type: "t3.medium"
   name: "jenkins-master"
  sonarqube:
   type: "t3.medium"
   name: "sonarqube-server"

# Kubernetes Cluster Configuration
k8s_cluster:
  worker_node_type: "t3.large"
  min_size: 3
  max_size: 10
  desired_capacity: 3
